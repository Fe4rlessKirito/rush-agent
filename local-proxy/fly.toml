app = "proxy-rust"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  LEECH__SERVER__HOST = "0.0.0.0"
  LEECH__SERVER__PORT = "8000"
  LEECH_DATA_DIR = "/data/usage"
  LEECH_TOR_DATA_ROOT = "/data/tor"
  TOR_BIN = "/usr/bin/tor"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[mounts]
  source = "proxy_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
